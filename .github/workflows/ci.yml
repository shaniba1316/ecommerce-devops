name: CI

on:
  push:
    branches:
      - main
      - 'feature/**'

  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Show project files
        run: ls -la

      - name: Build Docker image
        run: docker build -t ecommerce-api:ci .

      - name: Run Docker container
        run: docker run -d --name ecommerce-api -p 5000:5000 ecommerce-api:ci

      - name: Test API health
        run: |
          for i in {1..10}; do
            if curl --fail http://localhost:5000/health; then
              exit 0
            fi
            echo "API not ready yet. Retrying..."
            sleep 2
          done
          echo "API failed to become ready"
          docker logs ecommerce-api
          exit 1

      - name: Stop Docker container
        if: always()
        run: docker stop ecommerce-api
